name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'android/**'
      - 'bjj*.html'
      - 'three.min.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bjj-arena.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bjj-arena-apk
          path: bjj-arena.apk

      - name: Publish to release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'BJJ Arena — APK (свежая сборка)'
          body: |
            Установочный файл игры для Android.

            📲 Как установить:
            1. Скачайте `bjj-arena.apk` на телефон.
            2. Откройте файл и разрешите установку из неизвестных источников.
            3. Играйте! Внутри три версии: 3D-арена, 3D-додзё и лёгкая 2D.
          files: bjj-arena.apk
