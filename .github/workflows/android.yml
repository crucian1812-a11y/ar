name: Build BookTracker APK

on:
  push:
    branches: ["**"]
    paths:
      - "booktracker/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: booktracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: booktracker-debug-apk
          path: booktracker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to booktracker-apk-latest branch
        if: success()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls booktracker/app/build/outputs/apk/debug/*.apk | head -1)
          mkdir /tmp/btapk && cp "$APK" /tmp/btapk/booktracker.apk
          cd /tmp/btapk
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b booktracker-apk-latest
          git add booktracker.apk
          git commit -q -m "BookTracker APK build ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" booktracker-apk-latest

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bt-apk-${{ github.run_number }}
          name: BookTracker APK (build ${{ github.run_number }})
          files: booktracker/app/build/outputs/apk/debug/*.apk
          body: "Трекер книг — APK. Скачай и установи на Android (разреши установку из неизвестных источников)."
