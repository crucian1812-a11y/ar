name: Build Vityazi 3D APK

on:
  push:
    branches: ["**"]
    paths:
      - "vityazi3d/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_REL: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: |
          yes | sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download Godot headless + export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_REL}"
          wget -q "${BASE}/Godot_v${GODOT_REL}_linux.x86_64.zip" -O godot.zip
          wget -q "${BASE}/Godot_v${GODOT_REL}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          mv "Godot_v${GODOT_REL}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p "templates_tmp"
          unzip -q templates.tpz -d templates_tmp
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          mv templates_tmp/templates/* "$TPL_DIR"/
          echo "Installed templates to $TPL_DIR"

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$PWD/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 -deststoretype pkcs12

      - name: Configure Godot editor settings (Android SDK path)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "${PWD}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        working-directory: vityazi3d
        run: godot --headless --import || true

      - name: Self-test (headless logic smoke test)
        working-directory: vityazi3d
        continue-on-error: true
        run: |
          echo "Running headless self-test..."
          godot --headless -- --selftest 2>&1 | tee selftest.log || true
          echo "----- self-test result -----"
          grep "SELFTEST" selftest.log || echo "NO SELFTEST OUTPUT"

      - name: Export debug APK
        working-directory: vityazi3d
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/vityazi3d.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vityazi3d-debug-apk
          path: vityazi3d/build/*.apk
          if-no-files-found: error

      - name: Publish APK to apk-latest branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/apkout
          cp vityazi3d/build/vityazi3d.apk /tmp/apkout/vityazi3d.apk
          cd /tmp/apkout
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b apk-latest
          git add vityazi3d.apk
          git commit -q -m "APK build ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-latest

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vityazi 3D APK (build ${{ github.run_number }})
          files: vityazi3d/build/*.apk
          body: "Свежий APK игры «Витязи Новгорода 3D». Скачай vityazi3d.apk и установи на Android (разреши установку из неизвестных источников)."
